name: Backup restore test

# One-off / occasional verification that a real backup actually restores.
# Downloads the newest object from R2, decrypts it, and restores it into a
# disposable Postgres service container that only exists for this job —
# never touches dev or sys. Run manually whenever you want to re-verify
# the backup pipeline still produces a restorable dump.
on:
  workflow_dispatch: {}

jobs:
  restore:
    name: Restore latest backup into a throwaway Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && missing+=(R2_SECRET_ACCESS_KEY)
          [ -z "${{ secrets.R2_BUCKET }}" ] && missing+=(R2_BUCKET)
          [ -z "${{ secrets.R2_ENDPOINT }}" ] && missing+=(R2_ENDPOINT)
          [ -z "${{ secrets.BACKUP_ENCRYPTION_KEY }}" ] && missing+=(BACKUP_ENCRYPTION_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}."
            exit 1
          fi

      - name: Download newest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install --quiet awscli
          latest=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --query "sort_by(Contents, &LastModified)[-1].Key" --output text)
          if [ -z "$latest" ] || [ "$latest" = "None" ]; then
            echo "::error::No backups found in bucket $R2_BUCKET."
            exit 1
          fi
          echo "Restoring: $latest"
          aws s3 cp "s3://$R2_BUCKET/$latest" backup.sql.gpg --endpoint-url "$R2_ENDPOINT"

      - name: Decrypt
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          gpg --batch --yes --passphrase "$BACKUP_ENCRYPTION_KEY" -d backup.sql.gpg > backup.sql
          wc -l backup.sql

      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Restore into throwaway Postgres
        env:
          PGPASSWORD: postgres
        run: |
          /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d postgres -f backup.sql

      - name: Sanity check — table + row counts
        env:
          PGPASSWORD: postgres
        run: |
          /usr/lib/postgresql/17/bin/psql -h localhost -U postgres -d postgres -c "
            SELECT schemaname, relname, n_live_tup
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
            ORDER BY relname;
          "
